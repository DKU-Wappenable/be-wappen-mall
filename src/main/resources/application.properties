spring.application.name=be

# DevTools Restart 활성화
spring.devtools.restart.enabled=true

# 추가로 감시할 폴더 (Java 소스)
spring.devtools.restart.additional-paths=src/main/java

# LiveReload (브라우저 자동 새로고침)
spring.devtools.livereload.enabled=true


cloud.aws.credentials.access-key=YOUR_ACCESS_KEY
cloud.aws.credentials.secret-key=YOUR_SECRET_KEY
cloud.aws.s3.bucket=your-bucket-name
cloud.aws.region.static=ap-northeast-2

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=classpath:/static/,file:uploads/

# IAMPORT KEY, SECRET
iamport.key=${IAMPORT_KEY}
iamport.secret=${IAMPORT_SECRET}


# Custom config for JWT
jwt.secret=${JWT_SECRET}

# Entity 클래스 기반으로 DB 테이블 자동 생성 및 변경 감지 (개발 환경에서만 사용 권장)
# 개발 환경에서만 사용 권장 / 운영 환경에서는 validate 또는 none 권장
spring.jpa.hibernate.ddl-auto=create-drop


# Google OAuth2 , Google은 Spring Security에서 Provider 내장
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Naver OAuth2
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 로그 상세히 보기 위해 설정
logging.level.org.springframework.security=DEBUG
logging.level.com.wappenable=DEBUG

# Admin 계정 초기화
admin.email=${ADMIN_EMAIL:admin@wappen.com}
admin.password=${ADMIN_PASSWORD:admin123!}